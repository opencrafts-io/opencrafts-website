name: Deploy to GitHub Pages

on:
  # Deploy on merge to main only — never from a pull request.
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# Let an in-flight deploy finish rather than publishing a half-built site.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned rather than "latest" so a Bun release cannot change the
          # output of a deploy that nobody touched. Bump deliberately.
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build static export
        run: bun run build

      # GitHub Pages runs the output through Jekyll, which silently skips any
      # path beginning with an underscore. Next serves all its CSS and JS from
      # /_next/, so without this the pages load with no styles and no scripts.
      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      # Fail loudly if the export is missing a route, the domain file or the
      # sitemap, rather than publishing a broken site.
      - name: Verify export
        run: |
          set -e
          for f in out/index.html out/about/index.html out/services/index.html \
                   out/products/index.html out/products/rizzit/index.html \
                   out/404.html out/CNAME out/sitemap.xml out/robots.txt \
                   out/og.png out/.nojekyll; do
            [ -f "$f" ] || { echo "MISSING: $f"; exit 1; }
          done
          grep -qx 'opencrafts.io' out/CNAME || { echo "CNAME content unexpected"; exit 1; }
          [ -d out/_next ] || { echo "MISSING: out/_next"; exit 1; }
          echo "Export verified: $(find out -name '*.html' | wc -l) HTML files"

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: out
          clean: true
